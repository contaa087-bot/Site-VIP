<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel ADM - Controle & Métricas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --bg: #0b0e14; 
      --card: #131a24; 
      --green: #22c55e; 
      --yellow: #facc15; 
      --text: #fff; 
      --sub: #94a3b8; 
      --border: rgba(255,255,255,0.1);
    }
    
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 16px; margin: 0; }
    h1 { font-size: 20px; text-align: center; margin-bottom: 16px; }
    
    .tabs-nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border); color: var(--sub); font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--green); color: #000; border-color: var(--green); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    h2 { font-size: 16px; margin-top: 0; margin-bottom: 12px; color: var(--text); }
    
    input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; background: #080b10; color: #fff; font-size: 14px; box-sizing: border-box; }
    button.btn-primary { background: var(--green); color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--sub); background: rgba(255,255,255,0.03); }
    
    .badge { background: #22c55e22; color: #22c55e; padding: 2px 6px; border-radius: 4px; font-weight: bold; white-space: nowrap; display: inline-block; margin: 2px 0; }
    .countdown-text { color: var(--yellow); font-weight: 600; font-size: 11px; white-space: nowrap; }
    .expired-text { color: #ef4444; font-weight: 600; font-size: 11px; white-space: nowrap; }
    
    .user-info { display: flex; flex-direction: column; gap: 2px; }
    .user-email { font-weight: 600; color: #fff; font-size: 13px; word-break: break-all; }
    .user-id { font-size: 10px; color: var(--sub); font-family: monospace; opacity: 0.8; word-break: break-all; }

    /* DASHBOARD MÉTRICAS */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric-box {
      background: #080b10;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .metric-val {
      font-size: 20px;
      font-weight: 900;
      color: var(--yellow);
      margin-top: 4px;
    }
    .metric-label {
      font-size: 11px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <h1>📱 Painel ADM</h1>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="trocarAba('aba-liberacao', this)">⚡ Liberação & Vendas</button>
    <button class="tab-btn" onclick="trocarAba('aba-metricas', this)">📊 Métricas & Desempenho</button>
  </div>

  <!-- ABA 1: LIBERAÇÃO E LISTA DE VENDAS -->
  <div id="aba-liberacao" class="tab-content active">
    <div class="card">
      <h2>⚡ Liberação Manual (PayPal / PIX)</h2>
      <input type="email" id="adm-email" placeholder="E-mail do Cliente">
      <select id="adm-categoria">
        <option value="amador">Amador VIP</option>
        <option value="cam">Spycam VIP</option>
        <option value="famosinhas">Famosinhas VIP ✨</option>
        <option value="promo_30">Promoção Dupla (Leve 2 Pague 1)</option>
      </select>
      <select id="adm-dias">
        <option value="30">1 Mês (30 Dias)</option>
        <option value="90">3 Meses (90 Dias)</option>
        <option value="365">1 Ano (365 Dias)</option>
      </select>
      <button class="btn-primary" onclick="liberarAcessoManual()">LIBERAR ACESSO AGORA</button>
    </div>

    <div class="card">
      <h2>🛒 Últimas Vendas / Liberações (Mais recentes no topo)</h2>
      <button onclick="carregarVendas()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); cursor: pointer;">🔄 Atualizar Vendas</button>
      <table>
        <thead>
          <tr>
            <th>Cliente / User ID</th>
            <th>Cat. / Planos</th>
            <th>Tempo Restante</th>
          </tr>
        </thead>
        <tbody id="tabela-vendas">
          <tr><td colspan="3" style="text-align:center;">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ABA 2: MÉTRICAS & RESUMO -->
  <div id="aba-metricas" class="tab-content">
    <div class="card">
      <h2>📊 Resumo das Ativações VIPs</h2>
      
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">Vips Ativos</div>
          <div class="metric-val" id="metric-total-vips">0</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Famosinhas VIP</div>
          <div class="metric-val" id="metric-famosinhas">0</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Amador VIP</div>
          <div class="metric-val" id="metric-amador">0</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Spycam VIP</div>
          <div class="metric-val" id="metric-cam">0</div>
        </div>
      </div>

      <button onclick="carregarMetricas()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); cursor: pointer;">🔄 Recalcular Métricas</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xjvkyofktqojuyequuxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__w-crANhzjiYKJuh2AX39w_Kz1-Rf74'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const EMAILS_ADMIN = [
      "chico@teste.com"
    ];

    window.onload = async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session || !EMAILS_ADMIN.includes(session.user.email)) {
        alert("Acesso restrito apenas ao administrador.");
        window.location.href = "index.html";
        return;
      }
      carregarVendas();
      carregarMetricas();
    };

    function trocarAba(abaId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(abaId).classList.add('active');
      btn.classList.add('active');
    }

    function calcularTempoRestante(dataExpiracaoStr) {
      if (!dataExpiracaoStr) return '<span class="expired-text">Sem Data</span>';
      
      const agora = new Date();
      const expira = new Date(dataExpiracaoStr);
      const diferencaMs = expira - agora;

      if (diferencaMs <= 0) {
        return '<span class="expired-text">Expirado ❌</span>';
      }

      const segundos = Math.floor(diferencaMs / 1000);
      const minutos = Math.floor(segundos / 60);
      const horas = Math.floor(minutos / 60);
      const dias = Math.floor(horas / 24);

      const restoHoras = horas % 24;
      const restoMinutos = minutos % 60;

      if (dias > 0) {
        return `<span class="countdown-text">Restam ${dias}d e ${restoHoras}h ⏳</span>`;
      } else if (horas > 0) {
        return `<span class="countdown-text">Restam ${horas}h e ${restoMinutos}m ⚠️</span>`;
      } else {
        return `<span class="countdown-text">Restam ${minutos} minutos 🚨</span>`;
      }
    }

    async function carregarVendas() {
      const tbody = document.getElementById('tabela-vendas');
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Carregando...</td></tr>';

      // Corrigido para ordenar por id em ordem decrescente (mais recentes primeiro)
      const { data: compras, error: erroCompras } = await _supabase
        .from('compras_usuario')
        .select('*')
        .order('id', { ascending: false })
        .limit(50);

      if (erroCompras) {
        console.error("Erro Supabase:", erroCompras);
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#ef4444;">Erro ao carregar vendas.</td></tr>';
        return;
      }

      if (!compras || compras.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhuma venda encontrada.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      compras.forEach(item => {
        const tempoRestanteHtml = calcularTempoRestante(item.data_expiracao);
        const emailCliente = item.email || 'E-mail não informado';
        const idExibicao = item.user_id ? item.user_id : 'Sem ID (Aguardando Cadastro)';

        tbody.innerHTML += `
          <tr>
            <td>
              <div class="user-info">
                <span class="user-email">${emailCliente}</span>
                <span class="user-id">ID: ${idExibicao}</span>
              </div>
            </td>
            <td><span class="badge">${item.categoria_id}</span></td>
            <td>${tempoRestanteHtml}</td>
          </tr>
        `;
      });
    }

    async function carregarMetricas() {
      const agoraStr = new Date().toISOString();

      const { data, error } = await _supabase
        .from('compras_usuario')
        .select('categoria_id')
        .gt('data_expiracao', agoraStr);

      if (error || !data) return;

      let countTotal = data.length;
      let countFamosinhas = 0;
      let countAmador = 0;
      let countCam = 0;

      data.forEach(item => {
        if (!item.categoria_id) return;
        const cat = item.categoria_id.toLowerCase();
        if (cat.includes('famosinhas')) countFamosinhas++;
        if (cat.includes('amador')) countAmador++;
        if (cat.includes('cam')) countCam++;
      });

      document.getElementById('metric-total-vips').innerText = countTotal;
      document.getElementById('metric-famosinhas').innerText = countFamosinhas;
      document.getElementById('metric-amador').innerText = countAmador;
      document.getElementById('metric-cam').innerText = countCam;
    }

    async function liberarAcessoManual() {
      const email = document.getElementById('adm-email').value.trim().toLowerCase();
      const categoriaSelecionada = document.getElementById('adm-categoria').value;
      const dias = parseInt(document.getElementById('adm-dias').value);

      if (!email) {
        alert("Digite o e-mail do cliente.");
        return;
      }

      let categoriasParaLiberar = [];
      if (categoriaSelecionada === 'promo_30') {
        categoriasParaLiberar = [`amador_${dias}`, `cam_${dias}`];
      } else {
        categoriasParaLiberar = [`${categoriaSelecionada}_${dias}`];
      }

      let errosOcorridos = [];

      for (const catId of categoriasParaLiberar) {
        const { error } = await _supabase.rpc('liberar_categoria_pix', {
          p_email: email,
          p_categoria_id: catId,
          p_dias: dias
        });

        if (error) {
          errosOcorridos.push(error.message);
        }
      }

      if (errosOcorridos.length > 0) {
        alert("Erro ao liberar acesso: " + errosOcorridos.join(', '));
      } else {
        alert(`✅ Acesso liberado com sucesso para ${email} (${categoriasParaLiberar.join(', ')})!`);
        document.getElementById('adm-email').value = '';
        carregarVendas();
        carregarMetricas();
      }
    }
  </script>
</body>
</html>
