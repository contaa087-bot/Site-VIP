<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria SPYCAM VIP 🔥</title>

  <!-- FAVICON INLINE -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23eab308%22/><text y=%22.9em%22 x=%2220%22 font-size=%2270%22 fill=%22black%22>🔞</text></svg>">

  <link rel="stylesheet" href="estilo-telegram.css">

  <style>
    :root {
      --bg-deep: #060910;
      --card-bg: #10161f;
      --yellow-pix: #eab308;
      --yellow-neon: #facc15;
      --border-neon: rgba(234, 179, 8, 0.35);
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
    }

    body {
      background-color: var(--bg-deep);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    .telegram-feed {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }

    .header-page {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-neon);
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .header-page h2 {
      font-size: 20px;
      font-weight: 900;
      color: #facc15;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .btn-voltar {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      border: 1px solid var(--border-neon);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn-voltar:hover {
      background: rgba(234, 179, 8, 0.3);
    }

    /* BOTOES E ABAS DE CATEGORIA */
    .categorias-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .btn-subcategoria {
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid var(--border-neon);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-subcategoria:hover {
      background: rgba(234, 179, 8, 0.1);
      color: #fff;
    }

    .btn-subcategoria.active {
      background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
      color: #000000;
      border-color: #facc15;
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
    }

    /* GRID RESPONSIVO */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 6px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    /* CARD INDIVIDUAL ESTILO NETFLIX */
    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border-neon);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .media-card:hover {
      transform: translateY(-3px);
      border-color: rgba(234, 179, 8, 0.7);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #000;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .media-card img.foto-galeria {
      width: 100%;
      height: auto;
      max-height: 500px;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* ESTILO DA PAGINAÇÃO NUMÉRICA */
    .pagination-bar {
      display: inline-flex;
      align-items: center;
      background: #141a24;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      overflow: hidden;
      margin: 30px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .pagination-btn {
      background: transparent;
      border: none;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      color: #9ca3af;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pagination-btn:last-child {
      border-right: none;
    }

    .pagination-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .pagination-btn.active {
      background: #202938;
      color: #ffffff;
      font-weight: 800;
      box-shadow: inset 0 -2px 0 0 #facc15;
    }

    .pagination-btn:disabled {
      color: #4b5563;
      cursor: not-allowed;
    }

    .pagination-dots {
      padding: 10px 12px;
      color: #6b7280;
      font-size: 13px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
    }
  </style>

  <!-- CARREGA A BIBLIOTECA DO SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="telegram-feed">
    <div class="header-page">
      <h2>🔥 Câmeras Escondidas / Spycam 🔥</h2>
      <a href="index.html" class="btn-voltar">← Início</a>
    </div>

    <!-- BOTÕES DE SUB-CATEGORIA -->
    <div class="categorias-container">
      <button id="btn-spycam" class="btn-subcategoria active" onclick="alterarSubcategoria('spycam')">Spycam 🔥</button>
      <button id="btn-flagras" class="btn-subcategoria" onclick="alterarSubcategoria('flagras')">👀 Flagras Ruas</button>
    </div>

    <!-- CONTAINER DE CONTEÚDO LIBERADO (GERENCIADO PELO APP.JS) -->
    <div id="conteudo-liberado" style="display: none;">
      <div id="feed-container" class="video-grid"></div>
      <div id="pagination-controls" style="text-align: center;"></div>
    </div>

    <!-- MENSAGEM CASO O USUÁRIO NÃO TENHA ACESSO -->
    <div id="conteudo-bloqueado" style="display: none; text-align: center; color: #fff; padding: 60px 20px; background: var(--card-bg); border: 1px solid var(--border-neon); border-radius: 20px; margin-top: 20px;">
      <h3 style="font-size: 22px; color: #facc15; margin-bottom: 10px;">🔒 Conteúdo Exclusivo VIP SPYCAM</h3>
      <p style="margin: 0 0 24px; color: var(--text-sub);">Você precisa adquirir o acesso para visualizar esta galeria privativa.</p>
      <a href="index.html#card-cam" class="btn-subcategoria active" style="text-decoration: none; display: inline-block; padding: 14px 28px; font-size: 15px;">Adquirir Acesso</a>
    </div>
  </main>

  <!-- SCRIPTS DOS LINKS -->
  <script src="links-cam.js"></script> 
  <script src="links-flagras.js"></script> 

  <!-- DEFINE A CATEGORIA CORRETA ANTES DO APP.JS -->
  <script>
    window.categoriaId = 'cam';
  </script>

  <!-- CARREGA O APP.JS COM SUPABASE (FAZ A VERIFICAÇÃO DE SEGURANÇA) -->
  <script src="app.js"></script>

  <!-- SCRIPT DE EXIBIÇÃO E NAVEGAÇÃO -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let paginaAtual = 1;
      let subcategoriaAtual = 'spycam';
      const ITENS_POR_PAGINA = 10;

      function removerAutoplay(url) {
        if (typeof url !== 'string') return url;
        let urlLimpa = url.replace(/([?&])autoplay=true/g, '');
        urlLimpa = urlLimpa.replace(/([?&])autoplay=1/g, '');
        if (urlLimpa.includes('?')) {
          urlLimpa += '&autoplay=false';
        } else {
          urlLimpa += '?autoplay=false';
        }
        return urlLimpa;
      }

      window.alterarSubcategoria = function(novaSubcategoria) {
        subcategoriaAtual = novaSubcategoria;
        paginaAtual = 1;

        document.getElementById('btn-spycam').classList.toggle('active', novaSubcategoria === 'spycam');
        document.getElementById('btn-flagras').classList.toggle('active', novaSubcategoria === 'flagras');

        renderizarFeed();
      };

      function renderizarPaginacao(totalPaginas) {
        if (totalPaginas <= 1) return '';

        let html = '<div class="pagination-bar">';

        // Botão Previous
        html += `<button class="pagination-btn" ${paginaAtual === 1 ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual - 1})">Previous</button>`;

        let paginas = [];
        if (totalPaginas <= 6) {
          for (let i = 1; i <= totalPaginas; i++) paginas.push(i);
        } else {
          if (paginaAtual <= 3) {
            paginas = [1, 2, 3, 4, '...', totalPaginas];
          } else if (paginaAtual >= totalPaginas - 2) {
            paginas = [1, '...', totalPaginas - 3, totalPaginas - 2, totalPaginas - 1, totalPaginas];
          } else {
            paginas = [1, '...', paginaAtual - 1, paginaAtual, paginaAtual + 1, '...', totalPaginas];
          }
        }

        paginas.forEach(p => {
          if (p === '...') {
            html += `<span class="pagination-dots">...</span>`;
          } else {
            html += `<button class="pagination-btn ${p === paginaAtual ? 'active' : ''}" onclick="mudarPagina(${p})">${p}</button>`;
          }
        });

        // Botão Next
        html += `<button class="pagination-btn" ${paginaAtual === totalPaginas ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual + 1})">Next</button>`;

        html += '</div>';
        return html;
      }

      function renderizarFeed() {
        const container = document.getElementById('feed-container');
        const paginationControls = document.getElementById('pagination-controls');

        const lista = subcategoriaAtual === 'spycam' 
          ? (window.linksCam || []) 
          : (window.linksFlagras || []);

        if (!container) return;

        if (lista.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#9ca3af; padding: 30px; grid-column: 1/-1;">Nenhum conteúdo encontrado nesta categoria.</p>';
          if (paginationControls) paginationControls.innerHTML = '';
          return;
        }

        const totalPaginas = Math.ceil(lista.length / ITENS_POR_PAGINA);
        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
        const fim = inicio + ITENS_POR_PAGINA;
        const itensPagina = lista.slice(inicio, fim);

        container.innerHTML = itensPagina.map(item => {
          const url = typeof item === 'string' ? item : (item.link || item.url || '');
          
          if (typeof url === 'string' && url.match(/\.(jpeg|jpg|gif|png|webp)($|\?)/i)) {
            return `
              <div class="media-card">
                <img src="${url}" class="foto-galeria" loading="lazy" alt="Galeria Spycam" />
              </div>
            `;
          } else {
            const urlSemPlay = removerAutoplay(url);
            return `
              <div class="media-card">
                <div class="video-wrapper">
                  <iframe src="${urlSemPlay}" loading="lazy" allow="accelerometer; gyroscope; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                </div>
              </div>
            `;
          }
        }).join('');

        if (paginationControls) {
          paginationControls.innerHTML = renderizarPaginacao(totalPaginas);
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.mudarPagina = function(novaPagina) {
        paginaAtual = novaPagina;
        renderizarFeed();
      };

      renderizarFeed();
    });
  </script>
</body>
</html>
